name: Java CI and Docker Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      - name: List files
        run: find . -maxdepth 2 -type f -name "*.xml" -o -name "*.yml"

      - name: Run unit tests
        run: |
          pwd
          ls -la
          cd online-registration-system || cd . || echo "Trying alternative paths"
          pwd
          if [ -f "pom.xml" ]; then
            mvn clean test --batch-mode
          else
            echo "ERROR: pom.xml not found"
            find . -name "pom.xml"
            exit 1
          fi

      - name: Package application
        run: |
          if [ -d "online-registration-system" ]; then
            cd online-registration-system && mvn package -DskipTests --batch-mode
          else
            mvn package -DskipTests --batch-mode
          fi
