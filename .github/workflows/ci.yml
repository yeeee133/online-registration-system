name: Java CI and Docker Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: List directory structure
        run: ls -la

      - name: Run unit tests
        run: cd online-registration-system && mvn clean test --batch-mode

      - name: Package application
        run: cd online-registration-system && mvn package -DskipTests --batch-mode
